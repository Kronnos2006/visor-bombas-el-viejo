<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vocatus · Vista teléfono</title><style>
*{box-sizing:border-box}body{margin:0;background:#120f0b;color:#f4ead8;font-family:'Segoe UI',sans-serif;min-height:100dvh}header{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid #f2b84b33}h1{font-size:16px;margin:0;font-weight:600}button,a{font:inherit;font-size:13px;padding:9px 13px;border:1px solid #f2b84b55;border-radius:8px;background:#221c14;color:#f4ead8;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#f2b84b;color:#120f0b}.stage{height:calc(100dvh - 70px);min-height:280px;display:grid;place-items:center;padding:12px;overflow:hidden}.device{width:390px;height:844px;position:relative;transform-origin:top left;border-radius:24px;overflow:hidden;outline:3px solid #68522d;box-shadow:0 15px 65px #0008;background:#120f0b}iframe{display:block;width:100%;height:100%;border:0}.holder{position:relative}button:focus-visible,a:focus-visible{outline:2px solid #f2b84b;outline-offset:3px}
</style></head><body><header><h1>Vocatus · Teléfono</h1><div><button type="button" data-width="390" aria-pressed="true">390 px</button> <button type="button" data-width="360" aria-pressed="false">360 px</button></div><a href="/?s=areas">Volver a PC</a></header><main class="stage"><div class="holder"><div class="device"><iframe src="/?s=areas" title="Visor Vocatus en tamaño de teléfono" allow="camera; fullscreen" allowfullscreen></iframe></div></div></main><script>
const stage=document.querySelector('.stage'),device=document.querySelector('.device'),holder=document.querySelector('.holder');let width=390;
function resize(){const height=844,scale=Math.min(1,(stage.clientWidth-30)/width,(stage.clientHeight-30)/height);device.style.width=width+'px';device.style.transform='scale('+scale+')';holder.style.width=width*scale+'px';holder.style.height=height*scale+'px';}
document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{width=Number(b.dataset.width);document.querySelectorAll('[data-width]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));resize();});new ResizeObserver(resize).observe(stage);resize();
</script></body></html>
